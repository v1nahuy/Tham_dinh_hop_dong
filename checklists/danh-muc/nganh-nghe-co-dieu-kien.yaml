ten: Ngành nghề kinh doanh có điều kiện
# Bản nháp để pháp chế duyệt.
# Chỉ trích những ngành, nghề gần với lĩnh vực của Công ty, không phải toàn bộ Phụ lục IV (198 ngành, nghề).
trang_thai: ban-nhap
nguon: >-
  Phụ lục IV Luật Đầu tư số 143/2025/QH15 (Điều 7 và Phụ lục IV có hiệu lực từ 01/7/2026, thay Phụ lục IV
  Luật Đầu tư 2020). Nội dung lấy qua nguồn thứ cấp (expertis.vn, thuvienphapluat.vn); CẦN PHÁP CHẾ ĐỐI CHIẾU BẢN GỐC.
ghi_chu: >-
  Theo nguồn thứ cấp, Phụ lục IV mới không còn mục "dịch vụ việc làm" và "cho thuê lại lao động". Công ty đã đăng ký
  7821 (Cung ứng lao động tạm thời) và 7822 (Cung ứng nguồn nhân lực khác): pháp chế cần xác nhận hai hoạt động này
  có còn là ngành nghề có điều kiện không.
  `nganh_dang_ky_lien_quan`: mã ngành đã đăng ký của Công ty có thể dẫn đến ngành nghề có điều kiện này (gợi ý tra cứu).
