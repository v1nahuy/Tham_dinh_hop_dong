  - {ma: "6810", ten: "Kinh doanh bất động sản, quyền sử dụng đất thuộc chủ sở hữu, chủ sử dụng hoặc đi thuê"}
  - {ma: "9311", ten: "Hoạt động của các cơ sở thể thao"}
