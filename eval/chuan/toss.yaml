      - ma: "15.D1"
        danh_gia: "khong_thoa"
        trich_dan:
          - "Bên A thuê Dịch vụ “Hệ thống Tối ưu Điều hành khai thác - Transformative Operations Support System (TOSS) giai đoạn T8/2026-T8/2031” của Bên B với các nội dung và phạm vi công việc chi tiết nêu tại Phụ lục 02: Yêu cầu kỹ thuật."
          - "Các báo cáo khác phát sinh theo nghiệp vụ thuộc yêu cầu kỹ thuật này"
        vi_tri: "1.1, trang 2; Phụ lục 02, TOSS-338, trang 40"
        ghi_chu: "Phụ lục 02 liệt kê 341 yêu cầu, nhưng nhiều yêu cầu mở hoặc định tính, không đo được (xem 12.L1)."
      # [Đạt] Tiêu chí nghiệm thu định lượng (số test case, tỷ lệ pass, chỉ số hiệu năng)
      - ma: "15.D2"
        danh_gia: "khong_thoa"
        trich_dan:
          - "Kết luận: Đáp ứng theo đúng yêu cầu kỹ thuật"
        vi_tri: "Phụ lục 05, Mẫu số 1, trang 48"
        ghi_chu: "Nghiệm thu Đạt/Không đạt theo chức năng; không có test case"
      # [Đạt] Thời hạn nghiệm thu được xác định bằng số ngày
      - ma: "15.D3"
        danh_gia: "thoa"
        trich_dan:
          - "Biên bản nghiệm thu kỹ thuật: Hai Bên thống nhất sẽ ký biên bản nghiệm thu kỹ thuật đối với chức năng phần mềm sau 03 (ba) ngày làm việc khi Bên B hoàn thành việc triển khai;"
          - "Biên bản nghiệm thu tổng thể: Trên cơ sở Biên bản nghiệm thu kỹ thuật và Biên bản nghiệm thu đào tạo, hai Bên sẽ tiến hành ký Biên bản nghiệm thu tổng thể sau 03 (ba) ngày làm việc kể từ khi hoàn thành triển khai các hạng mục dịch vụ."
        vi_tri: "3.3.1.b và c, trang 3"
        ghi_chu: ""
      # [Đạt] Có điều khoản nghiệm thu rõ ràng
      - ma: "15.D4"
        danh_gia: "thoa"
        trich_dan:
          - "Bên A có trách nhiệm ký xác nhận vào Biên bản nghiệm thu đúng thời hạn theo quy định tại Điều 3.3 của Hợp đồng."
          - "Trước ngày 10 (mười) hàng tháng của tháng kế tiếp, hai Bên sẽ tiến hành nghiệm thu chất lượng Dịch vụ của tháng trước đó."
        vi_tri: "6.2, trang 5; 3.3.2, trang 3"
        ghi_chu: "Có trình tự 3 biên bản + nghiệm thu tháng."
      # [Đạt] Có cơ chế xử lý lỗi (defect) phân loại theo mức độ nghiêm trọng
      - ma: "15.D5"
        danh_gia: "thoa"
        trich_dan:
          - "Cấp độ 1: Dịch vụ gián đoạn hoàn toàn hoặc bị gián đoạn phần lớn thời gian hoặc/và các chức năng quan trọng, thiết yếu không hoạt động, hoặc hoạt động không ổn định."
        vi_tri: "8.2, 8.3, trang 7"
        ghi_chu: "Phân loại áp cho giai đoạn vận hành; không có phân loại lỗi riêng trong giai đoạn nghiệm thu."
      # [Lưu ý] Tiêu chí nghiệm thu chỉ định tính (ví dụ "đáp ứng yêu cầu kinh doanh") mà không có thước đo cụ thể
      - ma: "15.L1"
        danh_gia: "thoa"
        trich_dan:
          - "Kết luận: Đáp ứng theo đúng yêu cầu kỹ thuật"
          - "Thanh toán giá trị dịch vụ còn lại sau Ngày đưa vào vận hành 30 ngày nếu hệ thống không tồn tại các lỗi không thể khắc phục"
        vi_tri: "Phụ lục 05, Mẫu số 1, trang 48; Phụ lục 01, Mục B, trang 14"
        ghi_chu: ""
      # [Vi phạm] Không có tiêu chí nghiệm thu — Khách hàng toàn quyền từ chối, Công ty không được thanh toán
      - ma: "15.V1"
        danh_gia: "khong_thoa"
        trich_dan:
          - "Kết luận: Đáp ứng theo đúng yêu cầu kỹ thuật"
        vi_tri: "Phụ lục 05, Mẫu số 1, trang 48"
        ghi_chu: "Có tiêu chí (định tính) theo Phụ lục 02."
      # [Vi phạm] Không có nghiệm thu mặc nhiên (deemed acceptance) khi Khách hàng không ký/không phản hồi trong thời hạn — dự án có thể treo vô hạn
      - ma: "15.V2"
        danh_gia: "thoa"
        trich_dan:
          - "Bên A có trách nhiệm ký xác nhận vào Biên bản nghiệm thu đúng thời hạn theo quy định tại Điều 3.3 của Hợp đồng."
        vi_tri: "6.2 trang 5"
        ghi_chu: "Bên A có nghĩa vụ ký đúng hạn nhưng không có hệ quả nghiệm thu mặc nhiên. Ngày đưa vào vận hành (mốc tính phí) phụ thuộc biên bản tổng thể."
