        vi_tri: "Phụ lục 02, TOSS-037, trang 20"
        ghi_chu: "Cần thông tin năng lực thực tế (ngoài HĐ)."
      # [Đạt] Cam kết hỗ trợ ngoài giờ hành chính có phụ phí hoặc giới hạn số lần mỗi tháng
      - ma: "14.D2"
